#---------------------------------- SERVICES -----------------------------------
services:
# -------------------------------- NGINX
  nginx:
    container_name: frontend
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
       - "443:80"
    networks:
      - transcendence

# -------------------------------- DATABASE (PostreSQL)

  db:
    container_name: db
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - transcendence
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 10s

# -------------------------------- BACKEND

  api:
    container_name: backend
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    networks:
      - transcendence
    depends_on:
      db:
        condition: service_healthy

#---------------------------------- VOLUMES -----------------------------------
volumes:
  pgdata:

#---------------------------------- NETWORKS -----------------------------------

networks:
  transcendence:
    driver: bridge

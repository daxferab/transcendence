services:

  nginx:
    container_name: nginx
    build: frontend
    ports:
      - "443:443"
    volumes:
      - web:/usr/share/nginx/html
 
  postgres:
    container_name: postgres
    build: backend
    ports:
      - "5432:5432"
    env_file: .env

volumes:
  web:
    driver: local
    driver_opts:
      device: $PWD/srcs/frontend/srcs
      o: bind
      type: none

networks:
  network:
    driver: bridge

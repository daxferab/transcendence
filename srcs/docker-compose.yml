#---------------------------------- SERVICES -----------------------------------
services:

  db:
    image: postgres
    build:
      context: db/
      dockerfile: Dockerfile
    container_name: postgres
    restart: always
    volumes:
      - db_volume:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  api:
    image: api
    build:
      context: api/
      dockerfile: Dockerfile
    container_name: api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network
    env_file:
      - .env

  frontend:
    image: frontend
    build:
      context: frontend/
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    networks:
      - network
    env_file:
      - .env

  nginx:
    image: nginx
    build:
      context: nginx/
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    depends_on:
      - api
      - frontend
    ports:
      - "443:443"
    networks:
      - network
    env_file:
      - .env

# -------------------------------- ADMINER (Manage the DB)

  adminer:
    container_name: adminer
    build: adminer
    ports:
      - "8080:8080"
    networks:
      - network

#----------------------------------- VOLUMES -----------------------------------

volumes:
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:?DATA_PATH is not set, run through make or export it}/postgres

#---------------------------------- NETWORKS -----------------------------------

networks:
  network:
    driver: bridge

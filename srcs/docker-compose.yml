#---------------------------------- SERVICES -----------------------------------
services:
# -------------------------------- NGINX
  nginx:
    container_name: nginx
    build: nginx
    ports:
      - "443:443"
    volumes:
      - web:/usr/share/nginx/html
    networks:
      - network

# -------------------------------- DATABASE (PostreSQL)

  db:
    container_name: postgres
    build: db
    env_file: .env
    networks:
      - network

# -------------------------------- BACKEND

  # api:
  #   container_name: backend
  #   build: api
  #   networks:
  #     - network

# -------------------------------- ADMINER (Manage the DB)

  adminer:
    container_name: adminer
    build: adminer
    ports:
      - "8080:8080"
    networks:
      - network

#----------------------------------- VOLUMES -----------------------------------

volumes:
  web:
    driver: local
    driver_opts:
      device: $PWD/srcs/nginx/srcs
      o: bind
      type: none
  pgdata:


#---------------------------------- NETWORKS -----------------------------------

networks:
  network:
    driver: bridge
